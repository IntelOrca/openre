name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
          sudo apt update
          sudo apt install -y g++-mingw-w64 unzip
          bash getdeps.sh
    - name: Build
      run: |
          cmake -B out
          cmake --build out
    - name: Package
      run: |
          cp out/openre.dll dist
          cp lib/bin/lua54.dll dist
          cp LICENSE README.md dist
          chmod 664 dist/openre.dll
          chmod 664 dist/lua54.dll
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openre
        path: dist/**/*
